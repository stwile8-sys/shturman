name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --console=plain 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Save error report (only when the build fails)
        if: failure()
        run: |
          grep -E "^e: |error:|FAILED|What went wrong|Could not|Caused by|Unresolved" -A4 "$RUNNER_TEMP/build.log" | head -200 > "$RUNNER_TEMP/errors.txt" || true
          echo "----- tail -----" >> "$RUNNER_TEMP/errors.txt"
          tail -40 "$RUNNER_TEMP/build.log" >> "$RUNNER_TEMP/errors.txt"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -q --orphan buildlog
          git rm -rf -q .
          cp "$RUNNER_TEMP/errors.txt" errors.txt
          git add errors.txt
          git commit -q -m "Build errors for ${GITHUB_SHA}"
          git push -f origin buildlog

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Штурман, сборка ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
