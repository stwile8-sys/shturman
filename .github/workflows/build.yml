name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Download Google Fonts (themes)
        run: |
          mkdir -p app/src/main/res/font
          B=https://raw.githubusercontent.com/google/fonts/main/ofl
          dl() { curl -fsSL --retry 5 --retry-delay 3 -o "app/src/main/res/font/$1" "$B/$2"; }
          dl orbitron.ttf 'orbitron/Orbitron%5Bwght%5D.ttf'
          dl inter.ttf 'inter/Inter%5Bopsz,wght%5D.ttf'
          dl comfortaa.ttf 'comfortaa/Comfortaa%5Bwght%5D.ttf'
          dl bebas_neue.ttf 'bebasneue/BebasNeue-Regular.ttf'
          dl roboto_condensed.ttf 'robotocondensed/RobotoCondensed%5Bwght%5D.ttf'
          dl racing_sans_one.ttf 'racingsansone/RacingSansOne-Regular.ttf'
          dl oswald.ttf 'oswald/Oswald%5Bwght%5D.ttf'
          ls -la app/src/main/res/font

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug -PbuildNumber=${{ github.run_number }} --console=plain 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Save error report (only when the build fails)
        if: failure()
        run: |
          grep -E "^e: |error:|FAILED|What went wrong|Could not|Caused by|Unresolved" -A4 "$RUNNER_TEMP/build.log" | head -200 > "$RUNNER_TEMP/errors.txt" || true
          echo "----- tail -----" >> "$RUNNER_TEMP/errors.txt"
          tail -40 "$RUNNER_TEMP/build.log" >> "$RUNNER_TEMP/errors.txt"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -q --orphan buildlog
          git rm -rf -q .
          cp "$RUNNER_TEMP/errors.txt" errors.txt
          git add errors.txt
          git commit -q -m "Build errors for ${GITHUB_SHA}"
          git push -f origin buildlog

      - name: Test APK for the owner (night branch; the app never offers it to friends)
        if: success() && github.ref == 'refs/heads/night'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="$RUNNER_TEMP/shturman-night-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          for t in $(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName -q '.[].tagName' | grep '^night-' || true); do
            gh release delete "$t" --repo "${{ github.repository }}" --yes --cleanup-tag || true
          done
          gh release create "night-${{ github.run_number }}" "$APK" --repo "${{ github.repository }}" --prerelease \
            --target "${{ github.sha }}" --title "Тестовая сборка ${{ github.run_number }} (только для владельца)" \
            --notes "Тестовая сборка из ветки night. Обновлением друзьям не предлагается: приложение смотрит только релизы build-N."

      - name: Save warnings for review (night branch, successful builds)
        if: success() && github.ref == 'refs/heads/night'
        run: |
          grep -E "^w: " "$RUNNER_TEMP/build.log" | sed 's#file:///home/runner/work/shturman/shturman/##' | sort -u > "$RUNNER_TEMP/warnings.txt" || true
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -q --orphan buildwarn
          git rm -rf -q .
          cp "$RUNNER_TEMP/warnings.txt" warnings.txt
          git add warnings.txt
          git commit -q -m "Warnings for ${GITHUB_SHA}" || true
          git push -f origin buildwarn || true

      - name: Publish APK to Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: APEX, сборка ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
